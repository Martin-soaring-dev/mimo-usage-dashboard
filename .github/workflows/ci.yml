name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # MiMo Desktop 的目标用户环境是 Windows；优先在 Windows 验收路径、Python 调用和安装相关行为。
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Windows installer smoke test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/install-smoke.ps1
      # 引擎层：uninstall / doctor / 残留体检（临时目录 + 合成数据）
      - name: Installer engine tests (isolated)
        run: python test/test_installer.py
      # npm 真实安装流程：npm pack → 包内容与开发环境逐字节一致 → npm install 到临时
      # prefix → 用 shim 跑 install/report/upgrade/doctor/uninstall
      - name: npm package install flow
        run: node test/cli.test.mjs
      # 安装器是可靠升级器：升级 / 失败回滚 / 混装检测 / 未知文件保留 /
      # manifest 缺失时的 fail-closed / JSONC 原地修改保持注释 / 运行服务升级。
      - name: Windows installer upgrade & rollback tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/install-upgrade.ps1
      # 拆开 Python 与 Node 回归，失败时在 Actions 步骤级直接定位责任域。
      # 与 package.json 中 npm test 的执行清单和顺序保持一致。
      - name: Python usage and live-server regressions
        run: python test/test_python.py
      - name: Python context-limit regressions
        run: python test/test_issue5.py
      - name: Node runtime regressions
        run: node test/runtime-check.mjs
      - name: Node slash-command E2E
        run: node test/command-e2e.mjs
      - name: Node DOM regressions
        run: node test/ui-dom.mjs
      # UI 几何回归必须真实跑起来：--require-chrome 把「没有浏览器」变成显式失败（exit 1），
      # 绝不允许缺依赖时静默 SKIP 却让 CI 显示绿色。windows-latest 镜像预装 Chrome/Edge，
      # cdp.mjs 会依次探测 CHROME_PATH 与 Chrome/Edge 的标准安装路径。
      - name: UI geometry tests (headless browser, required)
        run: node test/ui-geometry.mjs --require-chrome
      - name: Live refresh e2e (headless browser, required)
        run: node test/refresh-e2e.mjs --require-chrome
      # 用量范围两档开关是纯前端交互：Python 侧只能断言「HTML 里有没有这些元素」，
      # 驱动不了点击、也验不到点完之后激活哪个标签、URL 变成什么。必须真实跑起来。
      - name: Usage scope switch (headless browser, required)
        run: node test/scope-switch.mjs --require-chrome
      - name: Package contents (dry run)
        run: npm pack --dry-run
