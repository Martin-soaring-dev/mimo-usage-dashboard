name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # MiMo Desktop 的目标用户环境是 Windows；优先在 Windows 验收路径、Python 调用和安装相关行为。
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Windows installer smoke test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/install-smoke.ps1
      - run: npm test
      - name: Package contents (dry run)
        run: npm pack --dry-run
