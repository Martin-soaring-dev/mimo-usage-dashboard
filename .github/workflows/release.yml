name: Release

# 推送形如 v0.1.0 的 tag 即触发：测试 -> 用 tag 版本号 -> 发布到 npm -> 建 GitHub Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 创建 GitHub Release
  id-token: write   # npm provenance / Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install
      - run: npm test

      - name: Sync version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # 方式一（默认）：使用仓库 Secret NPM_TOKEN（npm Automation token）
      # 方式二（免 token）：在 npmjs.com 该包设置 → Trusted Publisher 指向
      #   this repo + workflow filename "release.yml"，然后删掉下面的 env 即可。
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack tarball
        run: npm pack

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"
          generate_release_notes: true
