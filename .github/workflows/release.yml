name: Release

# 推送形如 v0.1.0 的 tag 即触发：先在 Windows 上跑全部测试（本项目的目标平台），
# 再用 tag 版本号发布到 npm，最后建 GitHub Release。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 创建 GitHub Release
  id-token: write   # npm provenance / Trusted Publishing

jobs:
  # 测试一律跑在 windows-latest：这是 MiMo Desktop 的目标平台，而且
  # test/test_installer.py 第 14 节断言的正是 Windows 文件系统语义
  # （只读文件挡不住 rmtree、被占用的文件删不掉、只读配置让 os.replace 失败）——
  # 同样的断言在 Linux 上会反向失败，所以这些套件不能在 ubuntu 上跑。
  # 测试集与 ci.yml 相同，只少掉需要真实浏览器的几何/刷新两个用例（它们留在 ci.yml）。
  verify-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Windows installer smoke test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/install-smoke.ps1
      - name: Installer engine tests (Windows filesystem semantics)
        run: python test/test_installer.py
      - name: Windows installer upgrade & rollback tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/install-upgrade.ps1
      - run: npm test
      # npm 真实安装流程：npm pack → 包内容与开发环境逐字节一致 → npm install 到临时
      # prefix → 用 shim 跑 install/report/upgrade/doctor/uninstall
      - name: npm package install flow
        run: node test/cli.test.mjs

  # 打包与发布留在 ubuntu：只做依赖安装、版本同步、npm 发布与出包。
  # needs 保证顺序：verify-windows 不过，就不会走到版本同步与发布。
  publish:
    needs: verify-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install

      - name: Sync version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # 方式一（默认）：使用仓库 Secret NPM_TOKEN（npm Automation token）
      # 方式二（免 token）：在 npmjs.com 该包设置 → Trusted Publisher 指向
      #   this repo + workflow filename "release.yml"，然后删掉下面的 env 即可。
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack tarball
        run: npm pack

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"
          generate_release_notes: true
