<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiMo Desktop · 用量统计</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --border:#e8eaed; --text:#1f2329; --muted:#8a9099;
    --accent:#3b6ef6; --accent-soft:#eaf0ff; --track:#eef0f3; --good:#16a34a;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171c; --panel:#1d2026; --border:#2b2f37; --text:#e7e9ee; --muted:#9aa1ac;
      --accent:#5b86ff; --accent-soft:#1e2740; --track:#272b33; --good:#4ade80;
      --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:13px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px}
  header.page{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  header.page h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
  .spacer{flex:1}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--border);
    border-radius:8px;padding:6px 12px;cursor:pointer;box-shadow:var(--shadow)}
  button:hover{border-color:var(--accent)}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:2px;box-shadow:var(--shadow)}
  .seg button{border:0;background:transparent;box-shadow:none;border-radius:7px;padding:5px 14px;color:var(--muted)}
  .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
  .hero{padding:20px 22px;margin:14px 0 12px;background:linear-gradient(180deg,var(--accent-soft),var(--panel))}
  .hero .label{color:var(--muted);font-size:12px;margin-bottom:6px}
  .hero .big{font-size:44px;font-weight:700;letter-spacing:-.5px;line-height:1}
  .hero .big span{font-size:16px;font-weight:600;color:var(--muted);margin-left:6px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{padding:14px 16px}
  .stat .num{font-size:22px;font-weight:650}
  .stat .lb{color:var(--muted);font-size:12px;margin-top:2px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .split{padding:14px 16px;position:relative}
  .split .bar{height:3px;border-radius:2px;background:var(--accent);width:20px;margin-bottom:10px}
  .split .k{color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
  .split .v{font-size:26px;font-weight:700;margin:4px 0 2px}
  section{margin-top:26px}
  section h2{font-size:13px;font-weight:650;margin:0 0 4px}
  section .desc{color:var(--muted);font-size:12px;margin-bottom:12px}
  .chartbox{padding:14px 12px 6px}
  svg{display:block;width:100%;height:auto}
  .hm{display:flex;gap:6px;padding:14px 16px 18px}
  .hm .dow{display:grid;grid-template-rows:repeat(7,var(--cell,12px));gap:3px;color:var(--muted);font-size:10px;padding-top:16px;width:14px;flex:none}
  .hm .dow span{line-height:var(--cell,12px);height:var(--cell,12px)}
  .hm .cols{overflow-x:auto;flex:1;min-width:0}
  .hm .months-grid{display:grid;grid-auto-flow:column;grid-auto-columns:var(--cell,12px);gap:3px;height:14px;margin-bottom:2px}
  .hm .months-grid>div{font-size:10px;color:var(--muted);white-space:nowrap;overflow:visible}
  .hm .grid{display:grid;grid-auto-flow:column;grid-auto-columns:var(--cell,12px);gap:3px}
  .hm .col{display:grid;grid-template-rows:repeat(7,var(--cell,12px));gap:3px}
  .hm .cell{width:var(--cell,12px);height:var(--cell,12px);border-radius:3px;background:var(--track)}
  .hm-row{padding:16px 16px 6px}
  .hm-row-cells{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
  .hm-row-cells .cell{height:22px;border-radius:4px;background:var(--track)}
  .hm-row-labels{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:7px}
  .hm-row-labels span{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden}
  .legend{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:11px;padding:0 16px 14px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .models{display:flex;flex-direction:column;gap:14px;padding:16px}
  .mrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center}
  .badge{width:24px;height:24px;border-radius:6px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .mname{font-weight:600;font-size:13px}
  .msub{color:var(--muted);font-size:11.5px}
  .mtrack{height:7px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:7px}
  .mfill{display:flex;height:100%;border-radius:4px;overflow:hidden;background:var(--track)}
  .mfill .seg{height:100%}
  .seg.fresh{background:var(--accent)}
  .seg.cache{background:var(--accent);opacity:.35}
  .mlegend{display:flex;align-items:center;gap:6px;padding:0 0 2px;color:var(--muted);font-size:11.5px}
  .mlegend .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .mlegend .dot.fresh{background:var(--accent)}
  .mlegend .dot.cache{background:var(--accent);opacity:.35}
  .mlegend .sep{width:14px}
  .mval{color:var(--accent);font-weight:700;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  th{color:var(--muted);font-weight:500}
  td.title{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .right{text-align:right}
  .tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:0;transform:translateY(-2px);
    transition:opacity .08s ease;background:var(--panel);border:1px solid var(--border);border-radius:9px;
    padding:6px 10px;box-shadow:0 6px 20px rgba(16,24,40,.16);white-space:nowrap;line-height:1.35}
  .tip.on{opacity:1}
  .tip .t-date{color:var(--muted);font-size:11px}
  .tip .t-val{font-size:13px;font-weight:650}
  .hit{cursor:crosshair;fill:transparent}
  .hit:hover{fill:var(--accent);fill-opacity:.14}
  .err{padding:16px;border-radius:10px;background:#fff2f0;border:1px solid #ffccc7;color:#a8071a}
  @media (max-width:820px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>MiMo Desktop · 用量统计</h1>
    <span class="muted small" id="gen"></span>
    <span class="spacer"></span>
    <span class="seg" id="seg">
      <button data-r="1">今日</button>
      <button data-r="7">7 天</button>
      <button data-r="30" class="on">30 天</button>
      <button data-r="0">全部</button>
    </span>
    <button id="refresh">刷新</button>
  </header>

  <div id="root"><div class="muted">加载中…</div></div>
</div>
<div id="tip" class="tip"></div>

<script>
const p2 = n => String(n).padStart(2, "0");
const ds = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const fmt = n => {
  n = Number(n) || 0;
  if (n >= 1e9) return (n/1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n/1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1) + "K";
  return String(Math.round(n));
};
const fmtInt = n => Number(n||0).toLocaleString("en-US");
const pct1 = x => (isFinite(x) ? (x*100).toFixed(1) : "0.0") + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svgNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs) => { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

let DATA = null, range = 30;

async function load() {
  const root = document.getElementById("root");
  try {
    const r = await fetch("api/usage", { cache: "no-store" });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    DATA = j;
    render();
  } catch (e) {
    root.innerHTML = `<div class="err"><b>读取失败：</b>${esc(e.message)}<br><br>
      请确认 MiMo Desktop 已至少使用过一次，且本机 Node ≥ 22（内置 node:sqlite）。</div>`;
  }
}

function rangeData() {
  const start = range === 0 ? null : (() => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - (range - 1)); return d; })();
  const fromDate = start ? ds(start) : null;
  const inRange = date => !fromDate || date >= fromDate;
  const daily = DATA.daily.filter(d => inRange(d.date));
  const agg = daily.reduce((a, d) => {
    a.tokens += d.tokens; a.input += d.input; a.output += d.output; a.reasoning += d.reasoning;
    a.read += d.read; a.write += d.write; a.requests += d.requests; a.tools += d.tools; return a;
  }, { tokens:0, input:0, output:0, reasoning:0, read:0, write:0, requests:0, tools:0 });
  const fromMs = start ? start.getTime() : 0;
  const sessions = DATA.sessions.filter(s => s.timeUpdated >= fromMs);
  const changes = sessions.reduce((a, s) => a + s.additions + s.deletions, 0);
  const files = sessions.reduce((a, s) => a + s.files, 0);
  const models = DATA.models.map(m => {
    let v = 0, cached = 0, uncached = 0;
    for (const [dt, tk] of Object.entries(m.daily)) if (inRange(dt)) v += tk;
    for (const [dt, rd] of Object.entries(m.dailyRead || {})) if (inRange(dt)) cached += rd;
    for (const [dt, ix] of Object.entries(m.dailyInput || {})) if (inRange(dt)) uncached += ix;
    return { ...m, rangeTokens: v, rangeCached: cached, rangeInput: uncached };
  }).filter(m => m.rangeTokens > 0).sort((a, b) => b.rangeTokens - a.rangeTokens);
  return { daily, agg, sessions, changes, files, models };
}

function lineChart(host, pts, color, fill) {
  const W = 880, H = 240, P = { l: 52, r: 14, t: 14, b: 26 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  const max = Math.max(1, ...pts.map(p => p.v));
  const innerW = W - P.l - P.r, innerH = H - P.t - P.b;
  const X = i => P.l + (pts.length <= 1 ? innerW / 2 : i * innerW / (pts.length - 1));
  const Y = v => P.t + (1 - v / max) * innerH;
  for (let g = 0; g <= 4; g++) {
    const y = P.t + innerH * g / 4;
    svg.appendChild(el("line", { x1: P.l, y1: y, x2: W - P.r, y2: y, stroke: "var(--border)", "stroke-width": 1 }));
    const t = el("text", { x: P.l - 8, y: y + 3, "text-anchor": "end", fill: "var(--muted)", "font-size": 10 });
    t.textContent = fmt(max * (4 - g) / 4); svg.appendChild(t);
  }
  const line = pts.map((p, i) => `${X(i)},${Y(p.v)}`).join(" ");
  if (fill) {
    svg.appendChild(el("polygon", { points: `${P.l},${P.t+innerH} ${line} ${X(pts.length-1)},${P.t+innerH}`, fill: color, opacity: .10 }));
  }
  svg.appendChild(el("polyline", { points: line, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
  pts.forEach((p, i) => {
    svg.appendChild(el("circle", { class: "hit", cx: X(i), cy: Y(p.v), r: 14, "data-tip": p.tipDate, "data-tip2": p.tipVal }));
  });
  const step = Math.max(1, Math.ceil(pts.length / 8));
  pts.forEach((p, i) => {
    if (i % step !== 0) return;
    const t = el("text", { x: X(i), y: H - 8, "text-anchor": "middle", fill: "var(--muted)", "font-size": 10 });
    t.textContent = p.label; svg.appendChild(t);
  });
  host.appendChild(svg);
}

function barChart(host, pts, color) {
  const W = 880, H = 200, P = { l: 46, r: 14, t: 14, b: 26 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  const max = Math.max(1, ...pts.map(p => p.v));
  const innerW = W - P.l - P.r, innerH = H - P.t - P.b;
  const bw = Math.max(1, (innerW / Math.max(1, pts.length)) * 0.62);
  for (let g = 0; g <= 3; g++) {
    const y = P.t + innerH * g / 3;
    svg.appendChild(el("line", { x1: P.l, y1: y, x2: W - P.r, y2: y, stroke: "var(--border)" }));
    const t = el("text", { x: P.l - 8, y: y + 3, "text-anchor": "end", fill: "var(--muted)", "font-size": 10 });
    t.textContent = Math.round(max * (3 - g) / 3); svg.appendChild(t);
  }
  pts.forEach((p, i) => {
    const cx = P.l + (i + 0.5) * innerW / Math.max(1, pts.length);
    const h = (p.v / max) * innerH;
    svg.appendChild(el("rect", { x: cx - bw / 2, y: P.t + innerH - h, width: bw, height: Math.max(0, h), rx: 2, fill: color }));
    const band = innerW / Math.max(1, pts.length);
    svg.appendChild(el("rect", { class: "hit", x: cx - band / 2, y: P.t, width: band, height: innerH, "data-tip": p.tipDate, "data-tip2": p.tipVal }));
    const step = Math.max(1, Math.ceil(pts.length / 8));
    if (i % step === 0) {
      const t = el("text", { x: cx, y: H - 8, "text-anchor": "middle", fill: "var(--muted)", "font-size": 10 });
      t.textContent = p.label; svg.appendChild(t);
    }
  });
  host.appendChild(svg);
}

function heatmap(host, daily) {
  const map = new Map(daily.map(d => [d.date, d.tokens]));
  const colors = ["var(--track)", "#c7d7fe", "#8fb0fb", "#5b86ff", "#2f57d6"];
  const values = [...map.values()].filter(v => v > 0).sort((a, b) => a - b);
  const q = p => values.length ? values[Math.min(values.length - 1, Math.floor(values.length * p))] : 0;
  const t1 = q(.25), t2 = q(.5), t3 = q(.75);
  const level = v => v <= 0 ? 0 : v <= t1 ? 1 : v <= t2 ? 2 : v <= t3 ? 3 : 4;

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - 364);
  start.setDate(start.getDate() - start.getDay()); // 对齐到周日
  const cols = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) cols.push(new Date(d));
  const weeks = [];
  for (let i = 0; i < cols.length; i += 7) weeks.push(cols.slice(i, i + 7));

  // 等比例放大格子以铺满卡片宽度
  const gap = 3;
  const colsN = weeks.length;
  const avail = Math.max(320, (host.clientWidth || 900) - 32 /* .hm 左右内边距 */ - 14 /* 星期列 */ - 6 /* flex gap */);
  const cellPx = Math.max(8, Math.min(28, (avail - (colsN - 1) * gap) / colsN));

  const wrap = document.createElement("div"); wrap.className = "hm";
  wrap.style.setProperty("--cell", cellPx.toFixed(2) + "px");
  const dow = document.createElement("div"); dow.className = "dow";
  dow.innerHTML = ["", "一", "", "三", "", "五", ""].map(x => `<span>${x}</span>`).join("");
  const months = document.createElement("div"); months.className = "months-grid";
  const grid = document.createElement("div"); grid.className = "grid";
  let lastMonth = -1;
  weeks.forEach((wk) => {
    const col = document.createElement("div"); col.className = "col";
    const m = wk[wk.length - 1].getMonth(); // 归属到包含该月首日的周列
    const mc = document.createElement("div");
    if (m !== lastMonth) { lastMonth = m; mc.textContent = (m + 1) + "月"; }
    months.appendChild(mc);
    wk.forEach(day => {
      const key = ds(day); const val = map.get(key) || 0;
      const c = document.createElement("div"); c.className = "cell";
      c.style.background = colors[level(val)];
      c.dataset.tip = key; c.dataset.tip2 = `${fmt(val)} tokens`;
      col.appendChild(c);
    });
    grid.appendChild(col);
  });
  const scroll = document.createElement("div"); scroll.className = "cols";
  scroll.appendChild(months);
  scroll.appendChild(grid);
  wrap.appendChild(dow); wrap.appendChild(scroll);
  host.appendChild(wrap);

  const legend = document.createElement("div"); legend.className = "legend";
  legend.innerHTML = "少 " + colors.map(c => `<i style="background:${c}"></i>`).join("") + " 多";
  host.appendChild(legend);
}

function render() {
  const r = rangeData();
  const agg = r.agg;
  const inp = agg.input + agg.read, out = agg.output + agg.reasoning;
  const cacheShare = inp > 0 ? agg.read / inp : 0;
  const label = range === 0 ? "全部时间" : range === 1 ? "今日" : `近 ${range} 天`;

  // 按范围选择时间尺度：今日=按小时，其余=按天
  const isToday = range === 1;
  const tstr = ds(new Date());
  let tokPts, sesPts, tokDesc, sesDesc;
  const hmTitle = "Token 热力图", hmDesc = "最近 12 个月，每日 token 汇总";
  if (isToday) {
    tokDesc = "每小时 token 总量"; sesDesc = "每小时活跃会话数";
    const hm = new Map(DATA.hourly.filter(h => h.date === tstr).map(h => [h.hour, h]));
    tokPts = Array.from({ length: 24 }, (_, h) => { const o = hm.get(h); const v = o ? o.tokens : 0; return { v, label: `${h}时`, tipDate: `${tstr} ${p2(h)}:00`, tipVal: `${fmt(v)} tokens` }; });
    sesPts = Array.from({ length: 24 }, (_, h) => { const o = hm.get(h); const v = o ? o.sessions : 0; return { v, label: `${h}时`, tipDate: `${tstr} ${p2(h)}:00`, tipVal: `${v} 会话` }; });
  } else {
    tokDesc = "每日 token 总量"; sesDesc = "每日活跃会话数";
    tokPts = r.daily.map(d => ({ v: d.tokens, label: d.date.slice(5).replace("-", "/"), tipDate: d.date, tipVal: `${fmt(d.tokens)} tokens` }));
    sesPts = r.daily.map(d => ({ v: d.sessions, label: d.date.slice(5).replace("-", "/"), tipDate: d.date, tipVal: `${d.sessions} 会话` }));
  }

  document.getElementById("gen").textContent =
    `更新于 ${new Date(DATA.generatedAt).toLocaleTimeString("zh-CN")} · ${DATA.dbPath}`;

  const root = document.getElementById("root");
  root.innerHTML = `
    <div class="card hero">
      <div class="label">${label}</div>
      <div class="big">${fmt(agg.tokens)}<span>tokens 消耗</span></div>
    </div>
    <div class="grid4">
      <div class="card stat"><div class="num">${fmtInt(r.sessions.length)}</div><div class="lb">会话</div></div>
      <div class="card stat"><div class="num">${fmtInt(agg.requests)}</div><div class="lb">请求</div></div>
      <div class="card stat"><div class="num">${fmtInt(agg.tools)}</div><div class="lb">工具</div></div>
      <div class="card stat"><div class="num">${fmt(r.changes)}</div><div class="lb">改动 · ${fmtInt(r.files)} 文件</div></div>
    </div>
    <section>
      <h2>Token 拆分</h2>
      <div class="grid3">
        <div class="card split"><div class="bar"></div><div class="k">输入 Tokens</div>
          <div class="v">${fmt(inp)}</div><div class="muted small">请求 + 缓存读取</div></div>
        <div class="card split"><div class="bar"></div><div class="k">输出 Tokens</div>
          <div class="v">${fmt(out)}</div><div class="muted small">响应 + 推理</div></div>
        <div class="card split"><div class="bar"></div><div class="k">缓存命中率</div>
          <div class="v">${pct1(cacheShare)}</div><div class="muted small">缓存读取 /（输入 + 缓存读取）</div></div>
      </div>
    </section>
    <section>
      <h2>${hmTitle}</h2>
      <div class="desc">${hmDesc}</div>
      <div class="card" id="hm"></div>
    </section>
    <section>
      <h2>${label} · 模型份额</h2>
      <div class="desc">token 份额 · 浅色表示缓存读取</div>
      <div class="card models" id="models"></div>
    </section>
    <section>
      <h2>${label} · tokens</h2>
      <div class="desc">${tokDesc}</div>
      <div class="card chartbox" id="line"></div>
    </section>
    <section>
      <h2>${label} · 会话</h2>
      <div class="desc">${sesDesc}</div>
      <div class="card chartbox" id="bars"></div>
    </section>
    <section>
      <h2>${label} · 最近会话</h2>
      <div class="desc">按最近活动排序</div>
      <div class="card" style="overflow:hidden">
        <table>
          <thead><tr><th>会话</th><th>模型</th><th class="right">Tokens</th><th class="right">请求</th><th class="right">工具</th><th class="right">更新</th></tr></thead>
          <tbody>${r.sessions.slice(0, 20).map(s => `
            <tr>
              <td class="title" title="${esc(s.title)}">${esc(s.title)}</td>
              <td class="muted">${esc(s.modelID || "-")}</td>
              <td class="right">${fmt(s.tokens)}</td>
              <td class="right">${fmtInt(s.requests)}</td>
              <td class="right">${fmtInt(s.tools)}</td>
              <td class="right muted">${new Date(s.timeUpdated).toLocaleDateString("zh-CN")}</td>
            </tr>`).join("") || `<tr><td colspan="6" class="muted" style="padding:16px">该范围内暂无会话</td></tr>`}
          </tbody>
        </table>
      </div>
    </section>
  `;

  heatmap(document.getElementById("hm"), DATA.daily);

  const totalModel = r.models.reduce((a, m) => a + m.rangeTokens, 0) || 1;
  const box = document.getElementById("models");
  if (!r.models.length) box.innerHTML = `<div class="muted">该范围内暂无模型调用</div>`;
  else box.innerHTML = `
    <div class="mlegend"><span class="dot fresh"></span>未命中缓存<span class="sep"></span><span class="dot cache"></span>缓存命中<span class="sep"></span>条内颜色 = 缓存命中率</div>`
  + r.models.slice(0, 12).map((m, i) => {
    const cached = m.rangeCached || 0;
    const uncached = m.rangeInput || 0;
    const denom = cached + uncached;
    const hit = denom > 0 ? cached / denom : 0;
    const freshPct = (1 - hit) * 100;
    const share = m.rangeTokens / totalModel * 100;
    const sub = `${fmt(m.rangeTokens)} tokens · 命中率 ${pct1(hit)} · ${esc(m.providerID)}`;
    const tip2 = `${fmt(m.rangeTokens)} tokens　缓存命中 ${fmt(cached)} / 未命中 ${fmt(uncached)}　命中率 ${pct1(hit)}`;
    return `
    <div class="mrow" data-tip="${esc(m.name)}" data-tip2="${esc(tip2)}">
      <div class="badge">${String(i+1).padStart(2,"0")}</div>
      <div>
        <div class="mname">${esc(m.name)}</div>
        <div class="msub">${sub}</div>
        <div class="mtrack"><div class="mfill" style="width:${share.toFixed(1)}%">
          <div class="seg fresh" style="width:${freshPct.toFixed(1)}%"></div>
          <div class="seg cache" style="width:${(100-freshPct).toFixed(1)}%"></div>
        </div></div>
      </div>
      <div class="mval">${pct1(hit)}</div>
    </div>`; }).join("");

  lineChart(document.getElementById("line"), tokPts, "var(--accent)", false);
  barChart(document.getElementById("bars"), sesPts, "var(--accent)");
}

document.getElementById("seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  range = Number(b.dataset.r);
  [...document.querySelectorAll("#seg button")].forEach(x => x.classList.toggle("on", x === b));
  if (DATA) render();
});
const tipEl = document.getElementById("tip");
function fmtDateCN(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):\d{2})?$/.exec(d || "");
  if (!m) return d || "";
  const base = `${m[1]}年${Number(m[2])}月${Number(m[3])}日`;
  return m[4] !== undefined ? `${base} ${Number(m[4])}:00` : base;
}
document.addEventListener("mousemove", (e) => {
  const t = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if (!t) { tipEl.classList.remove("on"); return; }
  tipEl.innerHTML = `<div class="t-date">${esc(fmtDateCN(t.getAttribute("data-tip")))}</div>`
    + `<div class="t-val">${esc(t.getAttribute("data-tip2") || "")}</div>`;
  tipEl.classList.add("on");
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > window.innerWidth - 6) x = e.clientX - w - 14;
  if (y + h > window.innerHeight - 6) y = e.clientY - h - 14;
  tipEl.style.left = x + "px";
  tipEl.style.top = y + "px";
});
window.addEventListener("scroll", () => tipEl.classList.remove("on"), true);
window.addEventListener("blur", () => tipEl.classList.remove("on"));

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (DATA) render(); }, 150);
});

document.getElementById("refresh").addEventListener("click", load);
load();
setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000); // 每 5 分钟自动刷新
</script>
</body>
</html>
